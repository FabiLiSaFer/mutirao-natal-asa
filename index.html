<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="txt-titulo-pagina">Plataforma de Gestão Solidária - Mutirão de Natal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; color: #2C3E50; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .text-verde-asa { color: #1E5128; }
        .bg-verde-asa { background-color: #1E5128; }
        .border-verde-asa { border-color: #1E5128; }
        .text-dourado { color: #C5A059; }
        .bg-dourado { background-color: #C5A059; }
        .border-dourado { border-color: #C5A059; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full bg-white shadow-sm py-3 px-6 flex justify-between items-center border-b border-dourado/30">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-dourado/40 shadow-sm flex-shrink-0 bg-[#F5EFEB] flex items-center justify-center">
                <span class="text-xs font-bold text-dourado">🌟</span>
            </div>
            <div>
                <h1 id="txt-logo-titulo" class="text-base font-bold text-verde-asa leading-tight">Mutirão de Natal</h1>
                <p id="txt-sub-topo" class="text-[11px] text-dourado font-medium uppercase tracking-wider">Gestão Solidária</p>
            </div>
        </div>
        <select id="seletor-idioma" onchange="mudarIdioma(this.value)" class="text-xs p-1.5 rounded-lg border border-dourado/40 bg-amber-50 text-dourado font-semibold focus:outline-none">
            <option value="pt">🇧🇷 Português</option>
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
        </select>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-4xl mx-auto w-full flex items-center justify-center">
        <!-- TELA DE ATIVAÇÃO -->
        <div id="tela-ativacao-chave" class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center border border-dourado/20 relative">
            <h2 class="text-2xl font-bold text-verde-asa mb-2">Ativação do Sistema</h2>
            <input type="text" id="input-chave-licenca" placeholder="Ex: MUTIRAO-2026-OFICIAL" class="w-full text-xs p-3 rounded-xl border border-gray-300 text-center font-mono uppercase tracking-wider mb-3">
            <button onclick="validarChaveLicenca()" class="w-full bg-verde-asa text-white font-medium py-3 rounded-xl text-xs">Ativar Licença de Uso</button>
        </div>

        <!-- PAINEL COORDENADOR (Simplificado para o seu pedido) -->
        <div id="painel-coordenador" class="hidden w-full space-y-6">
            <div class="bg-white rounded-2xl shadow-lg p-6 border border-dourado/20">
                <h3 class="text-xl font-bold text-verde-asa mb-4">Painel de Gestão</h3>
                
                <div class="flex flex-wrap gap-2 mb-6 border-b pb-4">
                    <button onclick="mudarAbaCoordenador('estoque')" class="text-xs font-bold px-3 py-2 rounded-lg bg-verde-asa text-white">Estoque</button>
                    <button onclick="mudarAbaCoordenador('voluntarios')" class="text-xs font-bold px-3 py-2 rounded-lg bg-gray-100 text-gray-600">Voluntários</button>
                    <button onclick="mudarAbaCoordenador('associados')" class="text-xs font-bold px-3 py-2 rounded-lg bg-gray-100 text-gray-600">Associados</button>
                </div>

                <div id="conteudo-aba-estoque" class="space-y-4">
                     <table class="w-full text-xs text-left">
                        <thead class="bg-amber-50"><tr><th class="p-2">Item</th><th class="p-2">Meta</th><th class="p-2">Entradas</th></tr></thead>
                        <tbody id="tabela-estoque-coordenador"></tbody>
                     </table>
                </div>

                <div id="conteudo-aba-voluntarios" class="hidden space-y-4">
                    <input type="text" id="vol-nome-input" placeholder="Nome do Voluntário" class="w-full text-xs p-3 rounded-xl border">
                    <button onclick="gerarLinkVoluntario()" class="w-full bg-dourado text-white py-2 rounded-xl">Gerar Link</button>
                    <div id="lista-links-voluntarios" class="text-xs"></div>
                </div>

                <div id="conteudo-aba-associados" class="hidden space-y-4">
                    <input type="text" id="assoc-nome-input" placeholder="Nome do Associado" class="w-full text-xs p-3 rounded-xl border">
                    <button onclick="gerarLinkAssociado()" class="w-full bg-dourado text-white py-2 rounded-xl">Gerar Link</button>
                    <div id="lista-links-associados" class="text-xs"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CHAVE_MESTRE_VALIDA = "MUTIRAO-2026-OFICIAL";
        let dadosSistema = JSON.parse(localStorage.getItem('sys_campanha_data')) || { ativado: false, produtos: [], voluntarios: [], associados: [] };
        
        function salvarDadosLocal() { localStorage.setItem('sys_campanha_data', JSON.stringify(dadosSistema)); }

        // Função de copiar profissional (com ícone visual)
        function copiarParaAreaTransferencia(texto, idBotao) {
            navigator.clipboard.writeText(texto).then(() => {
                const botao = document.getElementById(idBotao);
                const textoOriginal = botao.innerHTML;
                botao.innerHTML = "✅ Copiado!";
                setTimeout(() => botao.innerHTML = textoOriginal, 2000);
            });
        }

        function gerarLinkVoluntario() {
            const nome = document.getElementById('vol-nome-input').value.trim();
            if(!nome) return alert('Digite o nome.');
            dadosSistema.voluntarios.push({ nome });
            salvarDadosLocal();
            atualizarListaVoluntarios();
        }

        function atualizarListaVoluntarios() {
            const baseUrl = window.location.origin + window.location.pathname;
            let html = '';
            dadosSistema.voluntarios.forEach((v, index) => {
                const link = `${baseUrl}?vol=${encodeURIComponent(v.nome)}`;
                html += `
                    <div class="p-3 border rounded mb-2 flex justify-between items-center bg-gray-50">
                        <span class="truncate mr-2">${v.nome}</span>
                        <button id="btn-vol-${index}" onclick="copiarParaAreaTransferencia('${link}', 'btn-vol-${index}')" class="bg-verde-asa text-white px-3 py-1 rounded text-[10px] font-bold flex items-center">
                            📋 Copiar Link
                        </button>
                    </div>`;
            });
            document.getElementById('lista-links-voluntarios').innerHTML = html;
        }

        function gerarLinkAssociado() {
            const nome = document.getElementById('assoc-nome-input').value.trim();
            if(!nome) return alert('Digite o nome.');
            if(!dadosSistema.associados) dadosSistema.associados = [];
            dadosSistema.associados.push({ nome });
            salvarDadosLocal();
            atualizarListaAssociados();
        }

        function atualizarListaAssociados() {
            const baseUrl = window.location.origin + window.location.pathname;
            let html = '';
            if(dadosSistema.associados) {
                dadosSistema.associados.forEach((a, index) => {
                    const link = `${baseUrl}?assoc=${encodeURIComponent(a.nome)}`;
                    html += `
                        <div class="p-3 border rounded mb-2 flex justify-between items-center bg-gray-50">
                            <span class="truncate mr-2">${a.nome}</span>
                            <button id="btn-assoc-${index}" onclick="copiarParaAreaTransferencia('${link}', 'btn-assoc-${index}')" class="bg-verde-asa text-white px-3 py-1 rounded text-[10px] font-bold flex items-center">
                                📋 Copiar Link
                            </button>
                        </div>`;
                });
            }
            document.getElementById('lista-links-associados').innerHTML = html;
        }

        function mudarAbaCoordenador(aba) {
            document.getElementById('conteudo-aba-estoque').classList.add('hidden');
            document.getElementById('conteudo-aba-voluntarios').classList.add('hidden');
            document.getElementById('conteudo-aba-associados').classList.add('hidden');
            document.getElementById('conteudo-aba-' + aba).classList.remove('hidden');
        }

        function validarChaveLicenca() { if(document.getElementById('input-chave-licenca').value === CHAVE_MESTRE_VALIDA) { dadosSistema.ativado = true; salvarDadosLocal(); location.reload(); } else { alert('Chave inválida!'); } }
        
        window.onload = function() {
            if(!dadosSistema.ativado) document.getElementById('tela-ativacao-chave').classList.remove('hidden');
            else {
                document.getElementById('painel-coordenador').classList.remove('hidden');
                atualizarListaVoluntarios();
                atualizarListaAssociados();
            }
        }
    </script>
</body>
</html>
