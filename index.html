<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutirão de Natal - ASA</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f5f2eb; /* Tom areia acolhedor */
            color: #2c2c2c;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho Institucional -->
    <header class="bg-white shadow-sm border-b border-amber-100 py-4 px-6">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-amber-700 flex items-center justify-center text-white font-bold text-lg shadow-md">
                    ASA
                </div>
                <div>
                    <h1 class="font-bold text-lg text-amber-900 leading-tight">Mutirão de Natal</h1>
                    <p class="text-xs text-gray-500">Ação Solidária Adventista</p>
                </div>
            </div>
            <span class="text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-1 rounded-full">
                Área Restrita
            </span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto w-full p-6 flex-grow flex flex-col justify-center">
        <div class="bg-white rounded-2xl shadow-xl border border-amber-100 p-8 text-center space-y-6">
            
            <div class="w-16 h-16 bg-amber-50 text-amber-700 rounded-2xl mx-auto flex items-center justify-center shadow-inner">
                <i data-lucide="heart-handshake" class="w-8 h-8"></i>
            </div>

            <div class="space-y-2">
                <h2 class="text-2xl font-bold text-gray-800">Bem-vindo(a)!</h2>
                <p class="text-sm text-gray-600">
                    Ferramenta de gestão e controle de doações para coordenadores e voluntários.
                </p>
            </div>

            <!-- Botão de Acesso / Entrada -->
            <div class="pt-4">
                <button onclick="alert('Sistema pronto para integração com o Banco de Dados (Supabase)!')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-6 text-xs text-gray-500">
        <p>&copy; 2026 Mutirão de Natal - ASA. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Inicializar os ícones
        lucide.createIcons();
    </script>
</body>
</html>
