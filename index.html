<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#315c45">
<title>Plataforma de Gestão</title>

<style>
:root{
  --sand:#f2ead9;
  --sand2:#e8dcc4;
  --cream:#faf6ed;
  --white:#fffdf8;
  --green:#315c45;
  --green2:#244936;
  --gold:#b99852;
  --gold2:#d1b76f;
  --text:#294235;
  --muted:#776f61;
  --border:#ddcfb5;
  --danger:#a64c45;
  --shadow:0 8px 25px rgba(70,55,30,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  background:var(--sand);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* LOGIN / ACESSO */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at top right,rgba(185,152,82,.16),transparent 35%),
    var(--sand);
}

.auth-card{
  width:min(520px,100%);
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:24px;
  padding:42px;
  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:30px;
}

.brand-mark{
  width:54px;
  height:54px;
  border-radius:16px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.brand-title{
  font-size:24px;
  color:var(--green);
}

.brand-sub{
  color:var(--gold);
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1,h2,h3{
  font-weight:normal;
}

.auth h1{
  font-size:36px;
  margin:0 0 12px;
  color:var(--green);
}

.auth p{
  color:var(--muted);
  line-height:1.6;
}

.field{
  margin:16px 0;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  color:var(--text);
}

input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--white);
  color:var(--text);
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(185,152,82,.12);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 18px;
  background:var(--green);
  color:#fff;
  transition:.2s;
}

.btn:hover{
  background:var(--green2);
}

.btn.gold{
  background:var(--gold);
}

.btn.light{
  background:var(--sand2);
  color:var(--text);
}

.btn.danger{
  background:var(--danger);
}

.btn.full{
  width:100%;
}

.btn.small{
  padding:8px 12px;
  font-size:13px;
}

.auth-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.link-btn{
  border:0;
  background:none;
  color:var(--green);
  text-decoration:underline;
  cursor:pointer;
  padding:8px 0;
}

.hidden{
  display:none!important;
}

/* ESTRUTURA */

.shell{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:#eee3cf;
  border-right:1px solid var(--border);
  padding:25px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.sidebar-brand{
  padding:5px 10px 28px;
  font-size:21px;
  color:var(--green);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  padding:12px 13px;
  border-radius:11px;
}

.nav button:hover,
.nav button.active{
  background:#dfd2b9;
  color:var(--green);
}

.nav-section{
  margin:22px 10px 7px;
  font-size:10px;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
}

.topbar{
  height:82px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 35px;
  background:#f7f0e3;
  border-bottom:1px solid var(--border);
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.lang{
  padding:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--white);
}

.content{
  padding:40px;
  max-width:1400px;
  margin:auto;
}

.page-title{
  font-size:39px;
  color:var(--green);
  margin:0 0 8px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:30px;
}

.grid{
  display:grid;
  gap:18px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
}

.card h3{
  margin-top:0;
  color:var(--green);
}

.stat{
  min-height:125px;
}

.stat-number{
  font-size:34px;
  color:var(--green);
  margin:12px 0 4px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.quick{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:18px;
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:16px;
  cursor:pointer;
}

.quick:hover{
  border-color:var(--gold);
}

.quick strong{
  color:var(--green);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}

th{
  color:var(--green);
  background:#f0e7d6;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e7dcc7;
  color:var(--green);
  font-size:12px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:14px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(40,50,40,.45);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:100;
}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--cream);
  border-radius:20px;
  padding:28px;
  border:1px solid var(--border);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:var(--green);
  color:#fff;
  padding:14px 18px;
  border-radius:12px;
  z-index:300;
  box-shadow:var(--shadow);
}

.footer-note{
  margin-top:35px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

/* RESPONSIVO */

@media(max-width:900px){
  .sidebar{
    width:210px;
  }
  .main{
    margin-left:210px;
    width:calc(100% - 210px);
  }
  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .shell{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:20px 15px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .auth-card{
    padding:25px;
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* ==========================================================
   PLATAFORMA DE GESTÃO
   Versão de teste
   Chave de acesso: TESTE2026
   ========================================================== */

const ACCESS_KEY = "TESTE2026";

const translations = {
  pt:{
    access:"Chave de acesso",
    accessText:"Digite a chave de acesso para iniciar.",
    enter:"Entrar",
    welcome:"Bem-vindo",
    welcomeText:"Cadastre sua unidade para começar a utilizar a plataforma.",
    register:"Cadastrar unidade",
    login:"Entrar",
    unitName:"Nome da unidade",
    director:"Nome do responsável",
    password:"Senha",
    confirmPassword:"Confirmar senha",
    keyword:"Palavra-chave para recuperação",
    keywordHelp:"Guarde essa palavra. Ela será usada se você precisar mudar sua senha.",
    save:"Salvar",
    dashboard:"Visão geral",
    families:"Famílias beneficiadas",
    items:"Itens",
    teams:"Equipes",
    collection:"Arrecadação conjunta",
    access:"Acessos",
    settings:"Configurações",
    campaign:"Campanha / evento atual",
    overview:"Visão geral",
    members:"Membros",
    ranking:"Classificação",
    deliveries:"Entregas",
    logout:"Sair"
  },
  en:{
    access:"Access key",
    accessText:"Enter the access key to start.",
    enter:"Enter",
    welcome:"Welcome",
    welcomeText:"Register your unit to start using the platform.",
    register:"Register unit",
    login:"Login",
    unitName:"Unit name",
    director:"Responsible person",
    password:"Password",
    confirmPassword:"Confirm password",
    keyword:"Recovery keyword",
    keywordHelp:"Keep this word. It will be used if you need to change your password.",
    save:"Save",
    dashboard:"Overview",
    families:"Beneficiary families",
    items:"Items",
    teams:"Teams",
    collection:"Joint collection",
    access:"Access",
    settings:"Settings",
    campaign:"Current campaign / event",
    overview:"Overview",
    members:"Members",
    ranking:"Ranking",
    deliveries:"Deliveries",
    logout:"Logout"
  },
  es:{
    access:"Clave de acceso",
    accessText:"Introduzca la clave de acceso para comenzar.",
    enter:"Entrar",
    welcome:"Bienvenido",
    welcomeText:"Registre su unidad para comenzar a utilizar la plataforma.",
    register:"Registrar unidad",
    login:"Iniciar sesión",
    unitName:"Nombre de la unidad",
    director:"Responsable",
    password:"Contraseña",
    confirmPassword:"Confirmar contraseña",
    keyword:"Palabra clave de recuperación",
    keywordHelp:"Guarde esta palabra. Se utilizará si necesita cambiar su contraseña.",
    save:"Guardar",
    dashboard:"Vista general",
    families:"Familias beneficiarias",
    items:"Artículos",
    teams:"Equipos",
    collection:"Recaudación conjunta",
    access:"Accesos",
    settings:"Configuración",
    campaign:"Campaña / evento actual",
    overview:"Vista general",
    members:"Miembros",
    ranking:"Clasificación",
    deliveries:"Entregas",
    logout:"Salir"
  }
};

let lang = localStorage.getItem("app_lang") || "pt";
let currentPage = "dashboard";

function t(key){
  return translations[lang][key] || translations.pt[key] || key;
}

function getUnits(){
  return JSON.parse(localStorage.getItem("gestao_units") || "{}");
}

function saveUnits(data){
  localStorage.setItem("gestao_units",JSON.stringify(data));
}

function currentUnit(){
  const id = localStorage.getItem("current_unit");
  if(!id) return null;
  return getUnits()[id] || null;
}

function saveCurrentUnit(unit){
  const units=getUnits();
  units[unit.id]=unit;
  saveUnits(units);
}

function newUnit(name,director,password,keyword){
  const id="U"+Date.now()+Math.random().toString(36).slice(2,7);

  return {
    id,
    name,
    director,
    password,
    keyword,
    campaign:"",
    families:[],
    items:[],
    teams:[],
    accesses:[],
    collection:{
      date:"",
      time:"",
      place:"",
      meeting:"",
      address:""
    },
    deliveries:[]
  };
}

function toast(message){
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* =========================
   TELAS DE ACESSO
   ========================= */

function renderAccess(){
  document.getElementById("root").innerHTML=`
  <div class="auth">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">Plataforma de Gestão</div>
          <div class="brand-sub">gestão • organização • cuidado</div>
        </div>
      </div>

      <h1>${t("access")}</h1>
      <p>${t("accessText")}</p>

      <div class="field">
        <label>${t("access")}</label>
        <input id="accessKey" type="password" placeholder="${t("access")}">
      </div>

      <button class="btn full" onclick="checkAccess()">${t("enter")}</button>

      <div style="text-align:center;margin-top:20px">
        <select class="lang" onchange="changeLang(this.value)">
          <option value="pt" ${lang==="pt"?"selected":""}>Português</option>
          <option value="en" ${lang==="en"?"selected":""}>English</option>
          <option value="es" ${lang==="es"?"selected":""}>Español</option>
        </select>
      </div>
    </div>
  </div>`;
}

function checkAccess(){
  const key=document.getElementById("accessKey").value.trim();

  if(key===ACCESS_KEY){
    localStorage.setItem("access_unlocked","1");

    if(currentUnit()){
      renderLogin();
    }else{
      renderWelcome();
    }
  }else{
    toast("Chave de acesso não encontrada.");
  }
}

function renderWelcome(){
  document.getElementById("root").innerHTML=`
  <div class="auth">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">Plataforma de Gestão</div>
          <div class="brand-sub">gestão • organização • cuidado</div>
        </div>
      </div>

      <h1>${t("welcome")}</h1>
      <p>${t("welcomeText")}</p>

      <button class="btn full" onclick="renderRegister()">
        ${t("register")}
      </button>

      <div style="text-align:center;margin-top:20px">
        <select class="lang" onchange="changeLang(this.value)">
          <option value="pt" ${lang==="pt"?"selected":""}>Português</option>
          <option value="en" ${lang==="en"?"selected":""}>English</option>
          <option value="es" ${lang==="es"?"selected":""}>Español</option>
        </select>
      </div>

    </div>
  </div>`;
}

function renderRegister(){
  document.getElementById("root").innerHTML=`
  <div class="auth">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-title">Plataforma de Gestão</div>
      </div>

      <h1>${t("register")}</h1>

      <div class="field">
        <label>${t("unitName")}</label>
        <input id="unitName">
      </div>

      <div class="field">
        <label>${t("director")}</label>
        <input id="director">
      </div>

      <div class="field">
        <label>${t("password")}</label>
        <input id="password" type="password">
      </div>

      <div class="field">
        <label>${t("confirmPassword")}</label>
        <input id="password2" type="password">
      </div>

      <div class="field">
        <label>${t("keyword")}</label>
        <input id="keyword">
        <small style="color:var(--muted)">
          ${t("keywordHelp")}
        </small>
      </div>

      <button class="btn full" onclick="registerUnit()">${t("save")}</button>

      <div style="text-align:center;margin-top:18px">
        <button class="link-btn" onclick="renderAccess()">← Voltar</button>
      </div>

    </div>
  </div>`;
}

function registerUnit(){

  const name=document.getElementById("unitName").value.trim();
  const director=document.getElementById("director").value.trim();
  const password=document.getElementById("password").value;
  const password2=document.getElementById("password2").value;
  const keyword=document.getElementById("keyword").value.trim();

  if(!name || !director || !password || !keyword){
    toast("Preencha todos os campos.");
    return;
  }

  if(password!==password2){
    toast("As senhas não conferem.");
    return;
  }

  const unit=newUnit(name,director,password,keyword);

  saveCurrentUnit(unit);
  localStorage.setItem("current_unit",unit.id);

  toast("Unidade cadastrada.");
  renderLogin();
}

function renderLogin(){
  const unit=currentUnit();

  if(!unit){
    renderWelcome();
    return;
  }

  document.getElementById("root").innerHTML=`
  <div class="auth">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">${escapeHtml(unit.name)}</div>
          <div class="brand-sub">Plataforma de Gestão</div>
        </div>
      </div>

      <h1>${t("login")}</h1>

      <div class="field">
        <label>${t("director")}</label>
        <input id="loginDirector" value="${escapeHtml(unit.director)}">
      </div>

      <div class="field">
        <label>${t("password")}</label>
        <input id="loginPassword" type="password">
      </div>

      <div class="field">
        <label>
          <input id="remember" type="checkbox" style="width:auto">
          Lembrar dados de login
        </label>
      </div>

      <button class="btn full" onclick="doLogin()">${t("enter")}</button>

      <div style="text-align:center;margin-top:15px">
        <button class="link-btn" onclick="forgotPassword()">Esqueci a senha</button>
      </div>

      <div style="text-align:center;margin-top:10px">
        <select class="lang" onchange="changeLang(this.value)">
          <option value="pt" ${lang==="pt"?"selected":""}>Português</option>
          <option value="en" ${lang==="en"?"selected":""}>English</option>
          <option value="es" ${lang==="es"?"selected":""}>Español</option>
        </select>
      </div>

    </div>
  </div>`;
}

function doLogin(){

  const unit=currentUnit();
  const password=document.getElementById("loginPassword").value;

  if(password!==unit.password){
    toast("Senha incorreta.");
    return;
  }

  localStorage.setItem("logged_in","1");
  renderApp();
}

function forgotPassword(){

  const unit=currentUnit();

  const word=prompt("Digite sua palavra-chave de recuperação:");

  if(word===null)return;

  if(word.trim().toLowerCase()===unit.keyword.toLowerCase()){

    const newPassword=prompt("Digite sua nova senha:");

    if(newPassword){
      unit.password=newPassword;
      saveCurrentUnit(unit);
      toast("Senha alterada.");
    }

  }else{
    toast("Palavra-chave incorreta.");
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

/* =========================
   APLICAÇÃO
   ========================= */

function renderApp(){

  const unit=currentUnit();

  if(!unit){
    renderWelcome();
    return;
  }

  document.getElementById("root").innerHTML=`

  <div class="shell">

    <aside class="sidebar">

      <div class="sidebar-brand">
        <strong>✦ ${escapeHtml(unit.name)}</strong>
      </div>

      <div class="nav">

        <button onclick="go('dashboard')" class="${currentPage==='dashboard'?'active':''}">
          ◇ ${t("dashboard")}
        </button>

        <button onclick="go('families')" class="${currentPage==='families'?'active':''}">
          ♧ ${t("families")}
        </button>

        <button onclick="go('items')" class="${currentPage==='items'?'active':''}">
          ▣ ${t("items")}
        </button>

        <button onclick="go('teams')" class="${currentPage==='teams'?'active':''}">
          ♧ ${t("teams")}
        </button>

        <button onclick="go('collection')" class="${currentPage==='collection'?'active':''}">
          ◷ ${t("collection")}
        </button>

        <button onclick="go('access')" class="${currentPage==='access'?'active':''}">
          ◇ ${t("access")}
        </button>

        <button onclick="go('settings')" class="${currentPage==='settings'?'active':''}">
          ⚙ ${t("settings")}
        </button>

      </div>

      <div style="position:absolute;bottom:20px;left:15px;right:15px">
        <button class="btn light full" onclick="logout()">Sair</button>
      </div>

    </aside>

    <main class="main">

      <header class="topbar">

        <div>
          <strong>${escapeHtml(unit.name)}</strong>
        </div>

        <div class="topbar-right">

          <select class="lang" onchange="changeLang(this.value)">
            <option value="pt" ${lang==="pt"?"selected":""}>PT</option>
            <option value="en" ${lang==="en"?"selected":""}>EN</option>
            <option value="es" ${lang==="es"?"selected":""}>ES</option>
          </select>

          <div style="
            width:38px;
            height:38px;
            border-radius:50%;
            background:var(--green);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;">
            ${escapeHtml(unit.director.charAt(0).toUpperCase())}
          </div>

        </div>

      </header>

      <section class="content" id="page"></section>

    </main>

  </div>`;

  renderPage();
}

function go(page){
  currentPage=page;
  renderApp();
}

function renderPage(){

  const pages={
    dashboard:pageDashboard,
    families:pageFamilies,
    items:pageItems,
    teams:pageTeams,
    collection:pageCollection,
    access:pageAccess,
    settings:pageSettings
  };

  pages[currentPage]();
}

/* =========================
   DASHBOARD
   ========================= */

function pageDashboard(){

  const unit=currentUnit();

  const familyCount=unit.families.length;
  const itemCount=unit.items.length;
  const teamCount=unit.teams.length;

  let totalNeeded=0;
  let totalReceived=0;

  unit.items.forEach(i=>{
    totalNeeded+=Number(i.needed)||0;
    totalReceived+=Number(i.have)||0;
  });

  const percent=totalNeeded?
    Math.min(100,Math.round(totalReceived/totalNeeded*100)):0;

  document.getElementById("page").innerHTML=`

    <h1 class="page-title">${t("dashboard")}</h1>

    <div class="page-subtitle">
      ${unit.campaign?
        escapeHtml(unit.campaign):
        "Nenhuma campanha ou evento cadastrado ainda."}
    </div>

    <div class="grid grid-4">

      <div class="card stat">
        <div>♧</div>
        <div class="stat-number">${familyCount}</div>
        <div class="stat-label">${t("families")}</div>
      </div>

      <div class="card stat">
        <div>▣</div>
        <div class="stat-number">${percent}%</div>
        <div class="stat-label">${t("items")}</div>
      </div>

      <div class="card stat">
        <div>♡</div>
        <div class="stat-number">${teamCount}</div>
        <div class="stat-label">${t("teams")}</div>
      </div>

      <div class="card stat">
        <div>◇</div>
        <div class="stat-number">${unit.deliveries.length}</div>
        <div class="stat-label">${t("deliveries")}</div>
      </div>

    </div>

    <h2 style="margin-top:38px">${t("overview")}</h2>

    <div class="grid grid-2">

      <div class="quick" onclick="go('families')">
        <div>
          <strong>${t("families")}</strong>
          <div>${familyCount} cadastradas</div>
        </div>
        <div>→</div>
      </div>

      <div class="quick" onclick="go('items')">
        <div>
          <strong>${t("items")}</strong>
          <div>${itemCount} cadastrados</div>
        </div>
        <div>→</div>
      </div>

      <div class="quick" onclick="go('teams')">
        <div>
          <strong>${t("teams")}</strong>
          <div>${teamCount} equipes</div>
        </div>
        <div>→</div>
      </div>

      <div class="quick" onclick="go('collection')">
        <div>
          <strong>${t("collection")}</strong>
          <div>${unit.collection.date || "Nenhuma data definida"}</div>
        </div>
        <div>→</div>
      </div>

    </div>

    <div class="card" style="margin-top:20px">

      <div class="toolbar">
        <strong>Campanha / evento atual</strong>
        <button class="btn small" onclick="editCampaign()">Editar</button>
      </div>

      <div style="font-size:25px;color:var(--green)">
        ${unit.campaign?
          escapeHtml(unit.campaign):
          "Defina aqui a campanha ou evento que será utilizado."}
      </div>

    </div>

    <div class="footer-note">
      Dedicado com carinho a Vera Lima.
    </div>
  `;
}

function editCampaign(){

  const unit=currentUnit();

  const value=prompt(
    "Digite o nome da campanha ou evento:",
    unit.campaign || ""
  );

  if(value!==null){
    unit.campaign=value.trim();
    saveCurrentUnit(unit);
    renderApp();
  }
}

/* =========================
   FAMÍLIAS
   ========================= */

function pageFamilies(){

  const unit=currentUnit();

  let rows="";

  unit.families.forEach((f,i)=>{

    rows+=`
    <tr>
      <td>${escapeHtml(f.responsible)}</td>
      <td>${f.people}</td>
      <td>${f.children}</td>
      <td>${f.elderly}</td>
      <td>
        <button class="btn small danger" onclick="deleteFamily(${i})">
          Excluir
        </button>
      </td>
    </tr>`;
  });

  document.getElementById("page").innerHTML=`

    <div class="toolbar">
      <div>
        <h1 class="page-title">${t("families")}</h1>
        <div class="page-subtitle">
          Cadastre as famílias que serão beneficiadas.
        </div>
      </div>

      <button class="btn" onclick="addFamily()">+ Cadastrar família</button>
    </div>

    <div class="card">

      ${unit.families.length===0?

        `<div class="empty">
          Nenhuma família cadastrada.
        </div>`

        :

        `<div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Responsável</th>
                <th>Pessoas</th>
                <th>Crianças</th>
                <th>Idosos</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`
      }

    </div>
  `;
}

function addFamily(){

  const responsible=prompt("Nome do responsável:");

  if(!responsible)return;

  const people=Number(prompt("Número de pessoas no grupo familiar:")||0);
  const children=Number(prompt("Número de crianças:")||0);

  let boys=0;
  let girls=0;

  if(children){
    boys=Number(prompt("Quantos são meninos?")||0);
    girls=Number(prompt("Quantas são meninas?")||0);
  }

  const elderly=Number(prompt("Quantos idosos com mais de 65 anos?")||0);

  const ages=[];

  for(let i=0;i<elderly;i++){
    ages.push(prompt("Idade do idoso "+(i+1)+":")||"");
  }

  const unit=currentUnit();

  unit.families.push({
    responsible,
    people,
    children,
    boys,
    girls,
    elderly,
    elderlyAges:ages
  });

  saveCurrentUnit(unit);
  renderApp();
}

function deleteFamily(i){

  if(!confirm("Excluir esta família?"))return;

  const unit=currentUnit();

  unit.families.splice(i,1);

  saveCurrentUnit(unit);
  renderApp();
}

/* =========================
   ITENS
   ========================= */

function pageItems(){

  const unit=currentUnit();

  let rows="";

  unit.items.forEach((item,i)=>{

    const missing=Math.max(0,(Number(item.needed)||0)-(Number(item.have)||0));

    rows+=`
    <tr>
      <td>${escapeHtml(item.name)}</td>
      <td>${item.needed}</td>
      <td>${item.have}</td>
      <td>${missing}</td>
      <td>${item.incoming||0}</td>
      <td>
        <button class="btn small" onclick="addIncoming(${i})">+ Entrada</button>
        <button class="btn small danger" onclick="deleteItem(${i})">Excluir</button>
      </td>
    </tr>`;
  });

  document.getElementById("page").innerHTML=`

    <div class="toolbar">

      <div>
        <h1 class="page-title">${t("items")}</h1>
        <div class="page-subtitle">
          Cadastre os itens necessários para a campanha ou evento.
        </div>
      </div>

      <button class="btn" onclick="addItem()">+ Cadastrar item</button>

    </div>

    <div class="card">

      ${unit.items.length===0?

      `<div class="empty">
        Nenhum item cadastrado.
      </div>`

      :

      `<div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Necessário</th>
              <th>Já possui</th>
              <th>Falta</th>
              <th>Entrando</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody>${rows}</tbody>

        </table>
      </div>`
      }

    </div>
  `;
}

function addItem(){

  const name=prompt("Nome do item:");

  if(!name)return;

  const needed=Number(prompt("Quantidade necessária:")||0);
  const have=Number(prompt("Quantidade que já possui:")||0);

  const unit=currentUnit();

  unit.items.push({
    name,
    needed,
    have,
    incoming:0
  });

  saveCurrentUnit(unit);
  renderApp();
}

function addIncoming(i){

  const amount=Number(prompt("Quantidade que entrou através dos mantenedores:")||0);

  if(!amount)return;

  const unit=currentUnit();

  unit.items[i].incoming=(Number(unit.items[i].incoming)||0)+amount;
  unit.items[i].have=(Number(unit.items[i].have)||0)+amount;

  saveCurrentUnit(unit);
  renderApp();
}

function deleteItem(i){

  if(!confirm("Excluir este item?"))return;

  const unit=currentUnit();

  unit.items.splice(i,1);

  saveCurrentUnit(unit);
  renderApp();
}

/* =========================
   EQUIPES
   ========================= */

function pageTeams(){

  const unit=currentUnit();

  let rows="";

  unit.teams.forEach((team,i)=>{

    rows+=`
    <tr>
      <td>${escapeHtml(team.name)}</td>
      <td>${team.members.length}</td>
      <td>${team.total}</td>
      <td>
        <button class="btn small" onclick="manageTeam(${i})">Abrir</button>
        <button class="btn small danger" onclick="deleteTeam(${i})">Excluir</button>
      </td>
    </tr>`;
  });

  document.getElementById("page").innerHTML=`

    <div class="toolbar">

      <div>
        <h1 class="page-title">${t("teams")}</h1>
        <div class="page-subtitle">
          Equipes mantenedoras e seus registros.
        </div>
      </div>

      <button class="btn" onclick="addTeam()">+ Nova equipe</button>

    </div>

    <div class="card">

      ${unit.teams.length===0?

      `<div class="empty">
        Nenhuma equipe cadastrada.
      </div>`

      :

      `<div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Equipe</th>
              <th>Membros</th>
              <th>Quantidade arrecadada</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody>${rows}</tbody>
        </table>
      </div>`
      }

    </div>
  `;
}

function addTeam(){

  const name=prompt("Nome da equipe:");

  if(!name)return;

  const unit=currentUnit();

  unit.teams.push({
    name,
    members:[],
    collections:[],
    total:0
  });

  saveCurrentUnit(unit);
  renderApp();
}

function deleteTeam(i){

  if(!confirm("Excluir esta equipe?"))return;

  const unit=currentUnit();

  unit.teams.splice(i,1);

  saveCurrentUnit(unit);
  renderApp();
}

function manageTeam(i){

  const unit=currentUnit();
  const team=unit.teams[i];

  const action=prompt(
`Equipe: ${team.name}

Digite:
1 - Adicionar membro
2 - Registrar item arrecadado
3 - Ver membros
4 - Voltar`
  );

  if(action==="1"){

    const name=prompt("Nome do membro:");

    if(name){
      team.members.push(name);
      team.members.sort((a,b)=>a.localeCompare(b));
      saveCurrentUnit(unit);
    }

    manageTeam(i);

  }else if(action==="2"){

    if(unit.items.length===0){
      alert("Cadastre primeiro os itens.");
      return;
    }

    const list=unit.items.map((x,n)=>`${n+1} - ${x.name}`).join("\n");

    const selected=Number(prompt("Escolha o item:\n\n"+list));

    if(!selected || !unit.items[selected-1])return;

    const amount=Number(prompt("Quantidade entregue:")||0);

    if(!amount)return;

    const deliveredBy=prompt("Nome de quem fez a entrega:");
    const receivedBy=prompt("Nome de quem recebeu:");

    const item=unit.items[selected-1];

    item.have=(Number(item.have)||0)+amount;

    team.collections.push({
      item:item.name,
      amount,
      deliveredBy,
      receivedBy,
      date:new Date().toLocaleString("pt-BR")
    });

    team.total=(Number(team.total)||0)+amount;

    unit.deliveries.push({
      team:team.name,
      item:item.name,
      amount,
      deliveredBy,
      receivedBy,
      date:new Date().toLocaleString("pt-BR")
    });

    saveCurrentUnit(unit);

    alert("Entrega registrada.");
    manageTeam(i);

  }else if(action==="3"){

    alert(
      team.members.length?
      team.members.join("\n"):
      "Nenhum membro cadastrado."
    );

    manageTeam(i);
  }
}

/* =========================

  document.getElementById("page").innerHTML=`

          Configure a arrecadação conjunta.
        </div>
      </div>

      <button class="btn" onclick="editCollection()">Editar</button>

    </div>

    <div class="grid grid-2">

      <div class="card">

        <p>${c.date || "Não definida"}</p>
      </div>

      <div class="card">
        <h3>Hora</h3>
        <p>${c.time || "Não definida"}</p>
      </div>

      <div class="card">
        <h3>Local</h3>
        <p>${c.place || "Não definido"}</p>
      </div>

      <div class="card">
        <h3>Ponto de encontro</h3>

function editCollection(){

  const unit=currentUnit();

  unit.collection.date=prompt("Data:",unit.collection.date)||"";
  unit.collection.time=prompt("Hora:",unit.collection.time)||"";
  unit.collection.place=prompt("Local:",unit.collection.place)||"";
  unit.collection.meeting=prompt("Ponto de encontro:",unit.collection.meeting)||"";
  unit.collection.address=prompt("Endereço:",unit.collection.address)||"";

  saveCurrentUnit(unit);
  renderApp();
}

/* =========================
   ACESSOS
   ========================= */

function pageAccess(){

  const unit=currentUnit();

  let rows="";

  unit.accesses.forEach((a,i)=>{

    rows+=`
    <tr>
      <td>${escapeHtml(a.name)}</td>
      <td>${a.role}</td>
      <td>
        <input
          readonly
          value="${escapeHtml(a.link)}"
          onclick="this.select()"
          style="max-width:330px">
      </td>
      <td>
        <button class="btn small" onclick="copyText('${escapeHtml(a.link)}')">
          Copiar
        </button>
      </td>
    </tr>`;
  });

  document.getElementById("page").innerHTML=`

    <div class="toolbar">

      <div>
        <h1 class="page-title">${t("access")}</h1>
        <div class="page-subtitle">
          Gere acessos para pessoas autorizadas.
        </div>
      </div>

      <button class="btn" onclick="createAccess()">
        + Gerar acesso
      </button>

    </div>

    <div class="card">

      <h3>Acessos armazenados</h3>

      ${unit.accesses.length===0?

      `<div class="empty">
        Nenhum acesso gerado.
      </div>`

      :

      `<div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Função</th>
              <th>Link / código</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`
      }

    </div>
  `;
}

function createAccess(){

  const name=prompt("Nome da pessoa:");

  if(!name)return;

  const role=prompt(
    "Função:\n\n1 - Diretor associado\n2 - Secretário\n3 - Líder mantenedor"
  );

  const roles={
    "1":"Diretor associado",
    "2":"Secretário",
    "3":"Líder mantenedor"
  };

  const roleName=roles[role] || "Líder mantenedor";

  const code="AC-"+Math.random().toString(36).slice(2,9).toUpperCase();

  const link=location.origin+location.pathname+"?access="+code;

  const unit=currentUnit();

  unit.accesses.push({
    name,
    role:roleName,
    code,
    link,
    created:new Date().toISOString()
  });

  saveCurrentUnit(unit);

  alert("Acesso criado:\n\n"+link);

  renderApp();
}

function copyText(text){

  navigator.clipboard?.writeText(text);

  toast("Copiado.");
}

/* =========================
   CONFIGURAÇÕES
   ========================= */

function pageSettings(){

  const unit=currentUnit();

  document.getElementById("page").innerHTML=`

    <h1 class="page-title">${t("settings")}</h1>

    <div class="grid grid-2">

      <div class="card">

        <h3>Dados da unidade</h3>

        <div class="field">
          <label>Nome da unidade</label>
          <input id="setName" value="${escapeHtml(unit.name)}">
        </div>

        <div class="field">
          <label>Responsável</label>
          <input id="setDirector" value="${escapeHtml(unit.director)}">
        </div>

        <button class="btn" onclick="saveSettings()">
          ${t("save")}
        </button>

      </div>

      <div class="card">

        <h3>Idioma</h3>

        <select onchange="changeLang(this.value)">
          <option value="pt" ${lang==="pt"?"selected":""}>Português</option>
          <option value="en" ${lang==="en"?"selected":""}>English</option>
          <option value="es" ${lang==="es"?"selected":""}>Español</option>
        </select>

        <p style="color:var(--muted);margin-top:20px">
          O idioma selecionado será utilizado na interface da plataforma.
        </p>

      </div>

    </div>

    <div class="card" style="margin-top:18px">
      <h3>Dados locais</h3>
      <p>
        Os dados desta unidade são armazenados neste dispositivo,
        separados pelo identificador exclusivo da unidade.
      </p>

      <button class="btn danger" onclick="clearLocalData()">
        Apagar dados desta unidade
      </button>
    </div>

  `;
}

function saveSettings(){

  const unit=currentUnit();

  unit.name=document.getElementById("setName").value.trim();
  unit.director=document.getElementById("setDirector").value.trim();

  saveCurrentUnit(unit);

  toast("Dados atualizados.");
  renderApp();
}

function clearLocalData(){

  if(!confirm(
    "Isso apagará todos os dados desta unidade neste dispositivo. Continuar?"
  ))return;

  const id=localStorage.getItem("current_unit");

  const units=getUnits();

  delete units[id];

  saveUnits(units);

  localStorage.removeItem("current_unit");
  localStorage.removeItem("logged_in");

  renderWelcome();
}

/* =========================
   IDIOMA
   ========================= */

function changeLang(value){

  lang=value;

  localStorage.setItem("app_lang",lang);

  if(localStorage.getItem("logged_in")==="1"){
    renderApp();
  }else if(currentUnit()){
    renderLogin();
  }else if(localStorage.getItem("access_unlocked")){
    renderWelcome();
  }else{
    renderAccess();
  }
}

/* =========================
   SAÍDA
   ========================= */

function logout(){

  localStorage.removeItem("logged_in");

  currentPage="dashboard";

  renderLogin();
}

/* =========================
   INICIALIZAÇÃO
   ========================= */

function start(){

  const logged=localStorage.getItem("logged_in")==="1";
  const unlocked=localStorage.getItem("access_unlocked")==="1";
  const unit=currentUnit();

  if(logged && unit){
    renderApp();
  }else if(unlocked && unit){
    renderLogin();
  }else{
    renderAccess();
  }
}

start();

</script>
