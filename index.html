<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d8c3a5">
<title>Plataforma de Gestão</title>

<style>
:root{
  --areia:#eee5d5;
  --areia2:#e4d4bc;
  --verde:#536b57;
  --verde2:#3f5745;
  --dourado:#b08a45;
  --texto:#403b34;
  --branco:#fffaf2;
  --borda:#d2c1a7;
  --vermelho:#a8544d;
  --sombra:0 8px 25px rgba(70,55,35,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--areia);
  color:var(--texto);
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

header{
  background:var(--verde);
  color:white;
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--sombra);
  position:sticky;
  top:0;
  z-index:20;
}

.logo-text{
  font-size:20px;
  font-weight:bold;
  letter-spacing:.3px;
}

.language{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.35);
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
}

.language option{
  color:var(--texto);
  background:var(--branco);
}

main{
  width:min(1180px,94%);
  margin:35px auto 60px;
}

.card{
  background:var(--branco);
  border:1px solid var(--borda);
  border-radius:18px;
  padding:28px;
  box-shadow:var(--sombra);
  margin-bottom:22px;
}

.center{
  max-width:620px;
  margin:70px auto;
  text-align:center;
}

h1,h2,h3{
  margin-top:0;
}

h1{
  color:var(--verde2);
  font-size:31px;
}

h2{
  color:var(--verde2);
  font-size:24px;
}

h3{
  color:var(--verde);
}

.subtitle{
  color:#716957;
  line-height:1.6;
}

.field{
  margin-bottom:16px;
  text-align:left;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--borda);
  border-radius:10px;
  background:#fffdf8;
  color:var(--texto);
  outline:none;
}

input:focus,select:focus{
  border-color:var(--dourado);
  box-shadow:0 0 0 3px rgba(176,138,69,.12);
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--verde);
  color:white;
}

.btn-gold{
  background:var(--dourado);
  color:white;
}

.btn-light{
  background:var(--areia2);
  color:var(--texto);
}

.btn-danger{
  background:var(--vermelho);
  color:white;
}

.btn-small{
  padding:8px 12px;
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.menu-card{
  background:var(--branco);
  border:1px solid var(--borda);
  border-radius:16px;
  padding:23px;
  cursor:pointer;
  transition:.2s;
  box-shadow:var(--sombra);
}

.menu-card:hover{
  transform:translateY(-3px);
  border-color:var(--dourado);
}

.menu-icon{
  font-size:28px;
  margin-bottom:12px;
}

.menu-card h3{
  margin-bottom:6px;
}

.menu-card p{
  margin:0;
  font-size:14px;
  color:#766e61;
  line-height:1.5;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fffdf8;
}

th,td{
  border-bottom:1px solid var(--borda);
  padding:11px;
  text-align:left;
  vertical-align:middle;
}

th{
  background:var(--areia2);
  color:var(--verde2);
}

.notice{
  padding:14px 16px;
  border-radius:10px;
  background:#f2eadc;
  border-left:4px solid var(--dourado);
  margin-bottom:18px;
}

.success{
  background:#e3eee4;
  border-left-color:var(--verde);
}

.error{
  background:#f4e0dc;
  border-left-color:var(--vermelho);
}

.hidden{
  display:none!important;
}

.back{
  margin-bottom:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:var(--branco);
  border:1px solid var(--borda);
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:27px;
  color:var(--verde2);
  margin-top:5px;
}

.link-box{
  display:flex;
  gap:8px;
}

.link-box input{
  flex:1;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
}

.checkbox input{
  width:auto;
}

.child-row,.elder-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
  padding:12px;
  background:#f5eee2;
  border-radius:10px;
}

.member-list{
  list-style:none;
  padding:0;
  margin:0;
}

.member-list li{
  padding:11px 13px;
  background:#f5eee2;
  margin-bottom:7px;
  border-radius:8px;
}

.score{
  font-size:20px;
  font-weight:bold;
  color:var(--dourado);
}

footer{
  text-align:center;
  color:#766e61;
  padding:25px;
  font-size:13px;
}

@media(max-width:800px){
  .grid,.dashboard,.stats{
    grid-template-columns:1fr;
  }
  header{
    padding:15px;
  }
  main{
    width:94%;
    margin-top:20px;
  }
  .card{
    padding:20px;
  }
  .child-row,.elder-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo-text" id="appTitle">Plataforma de Gestão</div>

  <select class="language" id="languageSelect" onchange="changeLanguage(this.value)">
    <option value="pt">Português</option>
    <option value="en">English</option>
    <option value="es">Español</option>
  </select>
</header>

<main id="app"></main>

<footer>
  <span id="dedication">Dedicado com carinho a Vera Lima</span>
</footer>

let db = JSON.parse(localStorage.getItem("gestaoDB") || "null");

if(!db){
  db = {
    unit:{
      name:"",
      director:"",
      password:"",
      recovery:"",
      campaign:"",
      items:[],
      families:[],
      users:[],
      teams:[],
      logs:[], // Registro de auditoria (Quem, o quê, quando)
      collection:{
        date:"",
        time:"",
        place:"",
        meeting:"",
        address:""
      }
    }
  };
  localStorage.setItem("gestaoDB", JSON.stringify(db));
}

function saveDB(){
  localStorage.setItem("gestaoDB", JSON.stringify(db));
  // Sincroniza também no armazenamento compartilhado para simular rede/outras abas
  localStorage.setItem("gestaoDB_sync", JSON.stringify(db));
}

// Ouve atualizações de outras abas ou janelas no mesmo navegador
window.addEventListener("storage", (e) => {
  if(e.key === "gestaoDB" || e.key === "gestaoDB_sync"){
    if(e.newValue){
      db = JSON.parse(e.newValue);
      if(currentUser && currentUser.role !== "director"){
        // Atualiza dados do usuário logado se houver mudança remota
        let updatedUser = db.unit.users.find(u => u.name === currentUser.name);
        if(updatedUser) currentUser = updatedUser;
      }
      render();
    }
  }
});

function logAction(userName, actionDesc){
  if(!db.unit.logs) db.unit.logs = [];
  const timestamp = new Date().toLocaleString("pt-BR");
  db.unit.logs.unshift({
    user: userName,
    action: actionDesc,
    time: timestamp
  });
  saveDB();
}

let lang = localStorage.getItem("language") || "pt";

function t(key){
  return translations[lang][key] || translations.pt[key] || key;
}

function changeLanguage(value){
  lang=value;
  localStorage.setItem("language",lang);
  render();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */

let page="access";
let currentUser=null;
let tokenToRegister=null;

function go(p){
  page=p;
  render();
}

function render(){
  document.documentElement.lang =
    lang==="pt" ? "pt-BR" : lang==="en" ? "en" : "es";

  const titleEl = document.getElementById("appTitle");
  if(titleEl) titleEl.textContent = t("title");
  
  const dedicationEl = document.getElementById("dedication");
  if(dedicationEl) dedicationEl.textContent = t("dedication");
  
  const langSelect = document.getElementById("languageSelect");
  if(langSelect) langSelect.value = lang;

  const app=document.getElementById("app");
  if(!app) return;

  const pages={
    access:pageAccess,
    welcome:pageWelcome,
    register:pageRegister,
    login:pageLogin,
    setpassword:pageSetPassword,
    director:pageDirector,
    items:pageItems,
    families:pageFamilies,
    accesses:pageAccesses,
    teams:pageTeams,
    collection:pageCollection,
    scoreboard:pageScoreboard,
    leader:pageLeader
  };

  app.innerHTML=pages[page] ? pages[page]() : pageAccess();
}

/* ============================================================
   PÁGINA 1 — CHAVE
   ============================================================ */

function pageAccess(){
return `
<div class="card center">
  <h1>${t("title")}</h1>
  <p class="subtitle">${t("accessText")}</p>

  <div class="field">
    <input id="accessKey"
      placeholder="${lang==="pt"?"Digite a chave de acesso":lang==="en"?"Enter access key":"Ingrese la clave de acceso"}">
  </div>

  <div id="accessMessage"></div>

  <div class="actions" style="justify-content:center">
    <button class="btn btn-primary" onclick="checkAccess()">
      ${t("enter")}
    </button>
  </div>
</div>`;
}

function checkAccess(){
  const key=document.getElementById("accessKey").value.trim();

  if(key.toUpperCase()===ACCESS_KEY){
    if(db.unit.name){
      go("login");
    } else {
      go("welcome");
    }
  }else{
    document.getElementById("accessMessage").innerHTML=
      `<div class="notice error">Chave de acesso não encontrada.</div>`;
  }
}

   BOAS-VINDAS
   ============================================================ */

function pageWelcome(){
return `
<div class="card center">
  <h1>${t("welcome")}</h1>
  <p class="subtitle">
    ${lang==="pt"
      ?"Para começar, cadastre a unidade que utilizará a plataforma."
      :lang==="en"
      ?"To begin, register the unit that will use the platform."
      :"Para comenzar, registre la unidad que utilizará la plataforma."}
  </p>

  <div class="actions" style="justify-content:center">
    <button class="btn btn-primary" onclick="go('register')">
      ${t("register")}
    </button>

    <button class="btn btn-light" onclick="go('login')">
      ${t("login")}
    </button>
  </div>
</div>`;
}

/* ============================================================
   CADASTRO
   ============================================================ */

function pageRegister(){
return `
<div class="card" style="max-width:700px;margin:auto">
  <button class="btn btn-light back" onclick="go('welcome')">←</button>

  <h2>${t("register")}</h2>

  <div class="field">
    <label>${t("churchName")}</label>
    <input id="regUnit">
  </div>

  <div class="field">
    <label>${t("director")}</label>
    <input id="regDirector">
  </div>

  <div class="field">
    <label>${t("password")}</label>
    <input id="regPass" type="password">
  </div>

  <div class="field">
    <label>${t("confirmPassword")}</label>
    <input id="regPass2" type="password">
  </div>

  <div class="field">
    <label>${t("recovery")}</label>
    <input id="regRecovery">
    <small>${t("recoveryHelp")}</small>
  </div>

  <div id="registerMessage"></div>

  <div class="actions">
    <button class="btn btn-primary" onclick="registerUnit()">
      ${t("register")}
    </button>
  </div>
</div>`;
}

function registerUnit(){

  const unit=document.getElementById("regUnit").value.trim();
  const director=document.getElementById("regDirector").value.trim();
  const pass=document.getElementById("regPass").value;
  const pass2=document.getElementById("regPass2").value;
  const recovery=document.getElementById("regRecovery").value.trim();

  if(!unit||!director||!pass||!pass2||!recovery){
    showMessage("registerMessage","Preencha todos os campos.","error");
    return;
  }

  if(pass!==pass2){
    showMessage("registerMessage",
      lang==="pt"?"As senhas não coincidem.":"Passwords do not match.","error");
    return;
  }

  db.unit.name=unit;
  db.unit.director=director;
  db.unit.password=pass;
  db.unit.recovery=recovery;

  logAction(director, "Cadastrou a unidade principal");
  saveDB();

  go("login");
}

/* ============================================================
   LOGIN
   ============================================================ */

function pageLogin(){

const unit=db.unit.name || "";

return `
<div class="card" style="max-width:600px;margin:auto">

  <button class="btn btn-light back" onclick="go('welcome')">←</button>

  <h2>${t("login")}</h2>

  <div class="notice">
    <strong>Unidade: ${unit || "—"}</strong>
  </div>

  <div class="field">
    <label>${t("name")}</label>
    <input id="loginName">
  </div>

  <div class="field">
    <label>${t("password")}</label>
    <input id="loginPass" type="password">
  </div>

  <label class="checkbox">
    <input type="checkbox" id="remember">
    ${t("remember")}
  </label>

  <div class="actions">
    <button class="btn btn-primary" onclick="login()">
      ${t("enter")}
    </button>

    <button class="btn btn-light" onclick="forgotPassword()">
      ${t("forgot")}
    </button>
  </div>

  <div id="loginMessage"></div>
</div>`;
}

function login(){

  const name=document.getElementById("loginName").value.trim();
  const pass=document.getElementById("loginPass").value;

  if(
    name===db.unit.director &&
    pass===db.unit.password
  ){
    currentUser={
      name:name,
      role:"director"
    };

    if(document.getElementById("remember").checked){
      localStorage.setItem("rememberLogin",name);
    }

    go("director");
    return;
  }

  const user=db.unit.users.find(
    u=>u.name===name && u.password===pass
  );

  if(user){
    currentUser=user;

    if(user.role==="leader"){
      go("leader");
    }else{
      go("director");

function saveFamily(){

const responsible=document.getElementById("familyResponsible").value.trim();
const people=Number(document.getElementById("familyPeople").value)||0;

if(!responsible||people<1){
  alert(
    lang==="pt"
      ?"Informe o responsável e a quantidade de pessoas."
      :"Enter the responsible person and number of people."
  );
  return;
}

const children=[];
const sexes=document.querySelectorAll(".childSex");
const ages=document.querySelectorAll(".childAge");

for(let i=0;i<sexes.length;i++){
  children.push({
    sex:sexes[i].value,
    age:Number(ages[i].value)||0
  });
}

const elderly=[];
const elderSex=document.querySelectorAll(".elderSex");
const elderAge=document.querySelectorAll(".elderAge");

for(let i=0;i<elderSex.length;i++){
  elderly.push({
    sex:elderSex[i].value,
    age:Number(elderAge[i].value)||0
  });
}

db.unit.families.push({
  responsible,
  people,
  children,
  elderly
});

logAction(currentUser?.name || db.unit.director, `Cadastrou a família de "${responsible}" (${people} pessoas)`);
saveDB();
go("families");
}

<td>${f.children.length}</td>
<td>${f.elderly.length}</td>
<td>
<div style="display:flex;gap:6px">
<button class="btn btn-gold btn-small"
onclick="viewFamilyDetails(${i})">
${t("details")}
</button>
<button class="btn btn-danger btn-small"
onclick="deleteFamily(${i})">
${t("delete")}
</button>
</div>
</td>
</tr>

`).join("")}

</tbody>
</table>
</div>`;
}

function viewFamilyDetails(i){
  const f=db.unit.families[i];
  let text=`Responsável: ${f.responsible}\nPessoas: ${f.people}\n\n`;
  text+=`--- Crianças (${f.children.length}) ---\n`;
  if(f.children.length){
    f.children.forEach((c,idx)=>{
      text+=`${idx+1}. Gênero: ${c.sex}, Idade: ${c.age} anos\n`;
    });
  }else{
    text+=`Nenhuma\n`;
  }

  text+=`\n--- Idosos > 65 (${f.elderly.length}) ---\n`;
  if(f.elderly.length){
    f.elderly.forEach((e,idx)=>{
      text+=`${idx+1}. Gênero: ${e.sex}, Idade: ${e.age} anos\n`;
    });
  }else{
    text+=`Nenhum\n`;
  }

  alert(text);
}

function deleteFamily(i){
  const famName = db.unit.families[i]?.responsible || "Família";
  db.unit.families.splice(i,1);

  saveDB();
  render();
}

</button>

<hr style="border:0;border-top:1px solid var(--borda);margin:28px 0">

<h3>${t("deliveries")}</h3>

${renderDeliveries()}

}

function saveLeaderTeamName(){

const name=document.getElementById("leaderTeamName").value.trim();

currentUser.teamName=name;

const idx=db.unit.users.findIndex(u=>u.token===currentUser.token || u.name===currentUser.name);

if(idx>=0){
db.unit.users[idx].teamName=name;
}

logAction(currentUser.name, `Atualizou o nome da equipe para "${name}"`);
saveDB();
render();
}

function addMember(){

const name=document.getElementById("memberName").value.trim();

if(!name)return;

currentUser.members=currentUser.members||[];
currentUser.members.push(name);

currentUser.members.sort((a,b)=>
a.localeCompare(b,"pt-BR")
);

const idx=db.unit.users.findIndex(u=>u.token===currentUser.token || u.name===currentUser.name);

if(idx>=0){
db.unit.users[idx].members=currentUser.members;
}

logAction(currentUser.name, `Adicionou o membro "${name}" à equipe`);
saveDB();
render();
}

function registerDelivery(){

const itemIndex=Number(document.getElementById("deliveryItem").value);
const quantity=Number(document.getElementById("deliveryQuantity").value)||0;

const deliveryBy=document.getElementById("deliveryBy").value.trim();
const receivedBy=document.getElementById("receivedBy").value.trim();

if(quantity<=0)return;

const item=db.unit.items[itemIndex];

if(!item)return;

item.entered+=quantity;

const delivery={
item:item.name,
quantity,
deliveryBy,
receivedBy,
date:new Date().toLocaleString()
};

currentUser.deliveries=currentUser.deliveries||[];
currentUser.deliveries.push(delivery);

const idx=db.unit.users.findIndex(u=>u.token===currentUser.token || u.name===currentUser.name);

if(idx>=0){
db.unit.users[idx].deliveries=currentUser.deliveries;
}

logAction(currentUser.name, `Registrou entrega de ${quantity} unidade(s) de "${item.name}"`);
saveDB();
render();
alert(lang==="pt"?"Entrega registrada e somada ao estoque geral com sucesso!":"Delivery registered successfully!");
}

function renderDeliveries(){

const list=currentUser.deliveries||[];

if(!list.length)
return `<p class="subtitle">${t("noData")}</p>`;

return `
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Item</th>
<th>${t("quantity")}</th>
<th>${t("deliveryBy")}</th>
<th>${t("receivedBy")}</th>
<th>${t("date")}</th>
</tr>
</thead>

<tbody>

${list.map((d)=>`

<tr>
<td>${escapeHTML(d.item)}</td>
<td>${d.quantity}</td>
<td>${escapeHTML(d.deliveryBy)}</td>
<td>${escapeHTML(d.receivedBy)}</td>
<td>${escapeHTML(d.date)}</td>
</tr>

`).join("")}

</tbody>
</table>
</div>`;
}

/* ============================================================
   CLASSIFICAÇÃO E COMPROVANTES (CONTROLADO PELO GESTOR)
   ============================================================ */

function pageScoreboard(){

const leaders=db.unit.users.filter(u=>u.role==="leader");

const scores=leaders.map(u=>{

const total=(u.deliveries||[]).reduce(
(sum,d)=>sum+Number(d.quantity||0),0
);

return {
name:u.name,
team:u.teamName||"—",
total,
deliveries:u.deliveries||[]
};

}).sort((a,b)=>b.total-a.total);

return `
<div class="card">

<button class="btn btn-light back" onclick="go('director')">
← ${t("directorArea")}
</button>

<h2>${t("scoreboard")} & ${t("deliveries")}</h2>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>#</th>
<th>${t("teamName")}</th>
<th>${t("leader")}</th>
<th>${t("quantity")}</th>
<th></th>
</tr>
</thead>

<tbody>

${scores.length ? scores.map((s,i)=>`

<tr>
<td class="score">${i+1}º</td>
<td>${escapeHTML(s.team)}</td>
<td>${escapeHTML(s.name)}</td>
<td><strong>${s.total}</strong></td>
<td>
  ${s.deliveries.length ? `
    <details>
      <summary style="cursor:pointer;color:var(--verde);font-weight:bold;">Ver entregas e emitir recibo</summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        ${s.deliveries.map((d,dIdx)=>`
          <div style="background:#f5eee2;padding:8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center">
            <span>${d.item} (${d.quantity} un) - De: ${d.deliveryBy} / Para: ${d.receivedBy}</span>
            <button class="btn btn-gold btn-small" onclick="directorReceipt('${s.name}', '${s.team}', ${dIdx})">${t("receipt")}</button>
          </div>
        `).join("")}
      </div>
    </details>
  ` : "Nenhuma entrega"}
</td>
</tr>

`).join("") :
`<tr><td colspan="5">${t("noData")}</td></tr>`}

</tbody>

</table>

</div>

</div>`;
}

function directorReceipt(leaderName, teamName, deliveryIndex){
  const leaderUser=db.unit.users.find(u=>u.name===leaderName);
  if(!leaderUser) return;
  const d=leaderUser.deliveries[deliveryIndex];

  const text=`
COMPROVANTE DE ENTREGA

Unidade: ${db.unit.name}

Equipe: ${teamName || "—"}

Líder: ${leaderName}

Item: ${d.item}

Quantidade: ${d.quantity}

Quem entregou: ${d.deliveryBy}

Quem recebeu: ${d.receivedBy}

Data: ${d.date}
`;

  const win=window.open("","_blank");
  win.document.write(`
  <pre style="
  font-family:Arial;
  padding:40px;
  font-size:16px;
  white-space:pre-wrap;
  ">${escapeHTML(text)}</pre>
  `);
  win.print();
}

function randomToken(){

"-"+

}

function copyText(text){

navigator.clipboard.writeText(text).then(()=>{

alert(
lang==="pt"
?"Link copiado."
:"Link copied."
);

}).catch(()=>{

prompt(
lang==="pt"
?"Copie o link:"
:"Copy the link:",
text
);

});

}

function showMessage(id,text,type="success"){

const el=document.getElementById(id);

if(el){
el.innerHTML=
`<div class="notice ${type}">${text}</div>`;
}

}

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJS(value){

return String(value ?? "")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}

function logout(){

currentUser=null;
go("access");

}

/* ============================================================
   ACESSO POR LINK GERADO (COMPARTILHAMENTO DE UNIDADE)
   ============================================================ */

function checkInvitation(){

const params=new URLSearchParams(location.search);
const token=params.get("access");

if(!token)return;

const user=db.unit.users.find(u=>u.token===token);

if(user){
  if(!user.password){
    tokenToRegister=token;
    page="setpassword";
  }else{
    currentUser = user;
    if(user.role==="leader"){
      page="leader";
    }else{
      page="director";
    }
  }
}

}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

checkInvitation();
render();
