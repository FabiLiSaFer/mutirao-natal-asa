<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Gestão e Logística</title>
</head>
<body class="bg-stone-50 p-4">

    <!-- PAINEL DO GESTOR -->
    <div id="painel-gestor" class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-stone-200">
        <h2 class="text-2xl font-bold text-emerald-900 mb-4">Painel de Gestão e Logística</h2>
        
        <!-- ABAS -->
        <div class="flex gap-2 mb-6 border-b pb-2 overflow-x-auto">
            <button onclick="mudarAba('evento')" class="px-4 py-2 bg-emerald-800 text-white rounded-lg text-sm font-bold">🎯 Evento</button>
            <button onclick="mudarAba('estoque')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-lg text-sm font-bold">📦 Estoque</button>
            <button onclick="mudarAba('familias')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-lg text-sm font-bold">🏠 Famílias</button>
            <button onclick="mudarAba('equipes')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-lg text-sm font-bold">🤝 Equipes</button>
        </div>

        <!-- CONTEÚDO EVENTO -->
        <div id="aba-evento" class="space-y-4">
            <input type="text" id="gestor-evento" placeholder="Nome do Evento" class="w-full p-3 border rounded-xl text-sm">
            <input type="text" id="gestor-data" placeholder="Data e Ponto de Encontro" class="w-full p-3 border rounded-xl text-sm">
            <input type="text" id="gestor-destaque" placeholder="Alimento da Semana" class="w-full p-3 border rounded-xl text-sm">
            <input type="text" id="gestor-casadinho" placeholder="Alimentos Casadinhos" class="w-full p-3 border rounded-xl text-sm">
            <button onclick="salvarEvento()" class="w-full bg-emerald-800 text-white p-3 rounded-xl font-bold">Salvar Logística do Evento</button>
        </div>

        <!-- CONTEÚDO FAMÍLIAS -->
        <div id="aba-familias" class="hidden space-y-3">
            <input type="text" id="fam-responsavel" placeholder="Responsável" class="w-full p-2 border rounded text-sm">
            <input type="number" id="fam-total" placeholder="Total de membros" class="w-full p-2 border rounded text-sm">
            <input type="number" id="fam-criancas" placeholder="Qtd de Crianças" class="w-full p-2 border rounded text-sm">
            <button onclick="cadastrarFamilia()" class="w-full bg-emerald-700 text-white p-2 rounded">Cadastrar Família</button>
            <div id="lista-familias" class="mt-4 text-xs"></div>
        </div>
        
        <!-- (Outras abas seriam adicionadas aqui...) -->
    </div>

    <!-- PAINEL DO VOLUNTÁRIO -->
    <div id="painel-voluntario" class="hidden max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-lg mt-6 border border-emerald-100">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-emerald-800">Missão: <span id="vol-nome-evento"></span></h2>
            <span class="text-2xl animate-bounce">👣</span> <!-- O sapatinho caminhando! -->
        </div>
        <div id="vol-info-logistica" class="bg-emerald-50 p-3 rounded-lg text-sm text-emerald-900 mb-4"></div>
        <div id="vol-destaques" class="grid grid-cols-2 gap-2 mb-4"></div>
        <div id="lista-registro" class="space-y-2"></div>
    </div>

    <script>
        // Lógica simplificada de teste
        function mudarAba(aba) {
            document.getElementById('aba-evento').classList.add('hidden');
            document.getElementById('aba-familias').classList.add('hidden');
            document.getElementById('aba-' + aba).classList.remove('hidden');
        }

        function salvarEvento() {
            const ev = document.getElementById('gestor-evento').value;
            localStorage.setItem('evento', ev);
            localStorage.setItem('logistica', document.getElementById('gestor-data').value);
            alert('Logística salva!');
        }

        function cadastrarFamilia() {
            const nome = document.getElementById('fam-responsavel').value;
            document.getElementById('lista-familias').innerHTML += `<p class="border-b py-1">${nome}</p>`;
        }
    </script>
</body>
</html>
